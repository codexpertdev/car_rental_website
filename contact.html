<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - CarWale</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { background:#000; color:#fff; }
    footer { background:#111; }
    .form-control { background:#222; color:#fff; border:none; }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background:#000; padding:15px 50px;">
  <a class="navbar-brand" href="index.html">CarWale</a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
    <ul class="navbar-nav">
      <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
      <li class="nav-item"><a class="nav-link" href="checkout.html">Checkout</a></li>
      <li class="nav-item"><a class="nav-link" href="my-orders.html">My Orders</a></li>
      <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
      <li class="nav-item"><a class="nav-link active" href="contact.html">Contact Us</a></li>
      <li class="nav-item"><a class="nav-link" data-bs-toggle="modal" data-bs-target="#searchModal"><i class="fas fa-search"></i> Search</a></li>
      <li class="nav-item"><a class="nav-link" data-bs-toggle="modal" data-bs-target="#cartModal"><i class="fas fa-shopping-cart"></i> <span id="cart-count" class="badge bg-danger">0</span></a></li>
    </ul>
  </div>
</nav>

<!-- Contact Us Section -->
<section class="py-5" style="margin-top:80px;">
  <div class="container">
    <h2 class="text-info text-center mb-4">Get In Touch</h2>
    <div class="row">
      <div class="col-md-6 mb-4">
        <form>
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" placeholder="Your Name">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="Your Email">
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" rows="5" placeholder="Your Message"></textarea>
          </div>
          <button type="submit" class="btn btn-info">Send Message</button>
        </form>
      </div>
      <div class="col-md-6">
        <h5 class="text-info">Contact Info</h5>
        <p><i class="fas fa-phone-alt"></i> +91 98765 43210</p>
        <p><i class="fas fa-envelope"></i> support@carshowroom.com</p>
        <p><i class="fas fa-map-marker-alt"></i> Mumbai, India</p>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!..." width="100%" height="250" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
      </div>
    </div>
  </div>
</section>

<!-- Footer -->
<footer class="text-light py-5" style="background:#111;">
  <div class="container text-center">
    <p>&copy; 2025 Car Showroom. All Rights Reserved.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
